name: Test MIDI conversion functionality
on:
  push:
    paths:
      - '.github/workflows/test-midi-conversion.yml'
  workflow_dispatch:
jobs:
  midi-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract converter source
        run: unzip -q stolperbeats-pattern-creator-github-ready.zip -d source
      - name: Run actual MIDI conversion against included fixture
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          echo '=== MIDI READER SOURCE ==='
          sed -n '1,150p' src/core/midi-file-reader.ts
          echo '=== MIDI TEST SOURCE ==='
          sed -n '1,140p' src/core/__tests__/midi-file-reader.test.ts
          echo '=== BANK FORMAT SOURCE ==='
          sed -n '1,150p' src/core/bank.ts
          echo '=== MIDI TEST FIXTURE ==='
          file src/core/__tests__/test.mid
          echo '=== EXECUTE MIDI CONVERSION TEST ==='
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/__tests__/midi-file-reader.test.ts')
          s = p.read_text()
          old = "./src/__tests__/test.mid"
          assert s.count(old) == 1, 'Unexpected fixture reference'
          s = s.replace(old, "./src/core/__tests__/test.mid")
          s = s.replace(".catch(console.error)", ".catch((error) => { console.error(error); process.exitCode = 1; })")
          p.write_text(s)
          PY
          npx --yes --package tsx tsx src/core/__tests__/midi-file-reader.test.ts > conversion-output.txt
          test -s conversion-output.txt
          grep -q 'KICK > PTN0:' conversion-output.txt
          grep -q 'SNARE > PTN0:' conversion-output.txt
          grep -q 'HIHAT1 > PTN0:' conversion-output.txt
          echo 'MIDI fixture converted into Stolperbeats bank text'
          head -n 8 conversion-output.txt
