name: Build Stolperbeats MIDI Converter for Mac
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  mac-app:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract existing app source
        shell: bash
        run: |
          unzip -q stolperbeats-pattern-creator-github-ready.zip -d extracted
          echo "ZIP contents:"
          find extracted -maxdepth 3 -type f | head -60
          PACKAGE=$(find extracted -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$PACKAGE" ]; then echo "No package.json in archive"; exit 1; fi
          echo "APP_DIR=$(dirname "$PACKAGE")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.APP_DIR }}
      - name: Remove duplicate density state declaration in archived source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/src/components/MidiUploader/index.tsx")
          s = p.read_text()
          decl = "const [densitySweepEnabled, setDensitySweepEnabled] = useState(false);"
          if s.count(decl) != 2:
              raise SystemExit(f"Expected 2 duplicate declarations, found {s.count(decl)}; refusing unsafe patch")
          index = s.rfind(decl)
          s = s[:index] + s[index + len(decl):]
          p.write_text(s)
          PY
      - name: Fix source density counter TypeScript error
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/src/core/density.ts")
          s = p.read_text()
          old = "arr.reduce((a, b) => a + b, 0)"
          new = "arr.reduce<number>((a, b) => a + Number(b), 0)"
          if old not in s:
              raise SystemExit("Unexpected density.ts contents; refusing unsafe edit")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build macOS application
        run: npm run dist -- --mac --arm64
        working-directory: ${{ env.APP_DIR }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: Stolperbeats-Mac-Apple-Silicon
          path: |
            ${{ env.APP_DIR }}/dist/*.dmg
            ${{ env.APP_DIR }}/dist/*.zip
          if-no-files-found: error
