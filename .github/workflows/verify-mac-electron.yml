name: Verify Apple Silicon Electron packaging
on:
  push:
    paths:
      - '.github/workflows/verify-mac-electron.yml'
  workflow_dispatch:
jobs:
  upgrade-test:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract application source
        run: unzip -q stolperbeats-pattern-creator-github-ready.zip -d source
      - name: Try updated framework and Electron toolchain in isolation
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          for(const [name,version] of Object.entries({'next':'^16.4.3','electron':'^41.7.1','electron-builder':'^26.18.0'})){
            if(p.dependencies?.[name]) p.dependencies[name]=version;
            else if(p.devDependencies?.[name]) p.devDependencies[name]=version;
            else throw new Error('Missing dependency: '+name);
          }
          fs.writeFileSync('package.json',JSON.stringify(p,null,2));
          console.log('Testing versions:',Object.fromEntries(['next','electron','electron-builder'].map(n=>[n,p.dependencies?.[n]||p.devDependencies?.[n]])));
          JS
          node - <<'JS'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          for(const [name,version] of Object.entries({'react':'^19.2.0','react-dom':'^19.2.0','typescript':'^5.9.3','@types/react':'^19.2.0','@types/react-dom':'^19.2.0'})){
            if(p.dependencies?.[name]) p.dependencies[name]=version;
            else if(p.devDependencies?.[name]) p.devDependencies[name]=version;
            else if(name.startsWith('@types/')) p.devDependencies[name]=version;
            else throw new Error('Missing dependency: '+name);
          }
          fs.writeFileSync('package.json',JSON.stringify(p,null,2));
          console.log('Testing React 19 and TypeScript 5 upgrades');
          JS
          node - <<'JS'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.devDependencies=p.devDependencies||{};
          p.devDependencies.eslint='^9.39.0';
          for(const group of ['dependencies','devDependencies']){
            if(p[group]?.['eslint-config-next']) p[group]['eslint-config-next']='^16.4.3';
          }
          if(!p.dependencies?.['eslint-config-next'] && !p.devDependencies?.['eslint-config-next']) throw new Error('eslint-config-next not found');
          if(p.overrides) delete p.overrides['brace-expansion'];
          fs.writeFileSync('package.json',JSON.stringify(p,null,2));
          console.log('Testing ESLint 9 with dependency-compatible brace-expansion versions');
          JS
          npm install --ignore-scripts --no-audit --no-fund
          npm audit fix --ignore-scripts --no-fund || echo 'Audit fix could not resolve all advisories; strict final audit will determine result'
          node -e "const m=require('minimatch'); console.log('minimatch installed:', require('minimatch/package.json').version, 'brace expansion API check:', typeof m.braceExpand); if(typeof m.braceExpand!=='function')process.exit(1)"
          echo '=== REMAINING PRODUCTION AUDIT ==='
          npm audit --omit=dev --audit-level=low || echo 'Production audit found outstanding vulnerabilities'
          echo '=== VULNERABLE BRACE-EXPANSION DEPENDENCY PATHS ==='
          npm ls brace-expansion --all || true
          echo '=== BRACE-EXPANSION INSTALLED VERSIONS ==='
          node - <<'JS'
          const fs=require('fs'),lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          for(const [path,p] of Object.entries(lock.packages||{})){
            if(path.endsWith('/brace-expansion')) console.log(path,p.version);
          }
          JS
          echo '=== FRAMEWORK BUILD TEST ==='
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/MidiUploader/index.tsx')
          s = p.read_text()
          duplicate = 'const [densitySweepEnabled, setDensitySweepEnabled] = useState(false);'
          if s.count(duplicate) != 2:
              raise SystemExit(f'Expected exactly 2 density declarations, found {s.count(duplicate)}')
          s = s.replace(duplicate, '', 1)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/density.ts')
          s = p.read_text()
          old = 'arr.reduce((a, b) => a + b, 0)'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one density counter expression, found {s.count(old)}')
          p.write_text(s.replace(old, 'arr.reduce<number>((a, b) => a + b, 0)'))
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/midi-file-reader.ts')
          s = p.read_text()
          old = 'convertMidiFileToPatterns(fileBuffer, midiNoteMap)'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one MIDI conversion call, found {s.count(old)}')
          p.write_text(s.replace(old, 'convertMidiFileToPatterns(Buffer.isBuffer(fileBuffer) ? fileBuffer : Buffer.from(fileBuffer), midiNoteMap)'))
          PY
          npm run build
          echo '=== FINAL DEPENDENCY SUMMARY ==='
          npm audit --omit=dev --json > audit-production.json || true
          node - <<'JS'
          const a=require('./audit-production.json');
          for(const [name,v] of Object.entries(a.vulnerabilities||{})){
            if(v.severity==='high'||v.severity==='critical') console.log('HIGH-SEVERITY:',name,JSON.stringify({severity:v.severity,via:v.via,fixAvailable:v.fixAvailable}).slice(0,3500));
          }
          JS
          node -e 'const a=require("./audit-production.json"); console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2))'
          echo '=== STRICT FINAL SECURITY GATE ==='
          node - <<'JS'
          const a=require('./audit-production.json');
          const v=a.metadata?.vulnerabilities||{};
          if((v.high||0)+(v.critical||0)>0) {
            console.error('FAILED: high/critical production vulnerabilities remain',v);
            process.exit(1);
          }
          console.log('PASSED: no high or critical production vulnerabilities',v);
          JS

      - name: Remove generator interface and fix static Electron packaging
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cat > src/pages/index.tsx <<'EOF'
          import Head from 'next/head';
          import MidiUploader from '@/components/MidiUploader';

          export default function Home() {
            return (
              <>
                <Head>
                  <title>Stolperbeats MIDI Converter</title>
                </Head>
                <main>
                  <MidiUploader />
                </main>
              </>
            );
          }
          EOF
          node - <<'JS'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.version=p.version || '0.1.0';
          p.build.productName='Stolperbeats MIDI Converter';
          p.build.appId='com.rob.stolperbeats.midiconverter';
          p.scripts['build:renderer']='next build';
          p.scripts.dist='npm run build:renderer && electron-builder';
          p.scripts.pack='npm run build:renderer && electron-builder --dir';
          fs.writeFileSync('package.json',JSON.stringify(p,null,2));
          const configPath='next.config.js';
          let s=fs.readFileSync(configPath,'utf8');
          if(!s.includes('output:')) s=s.replace(/(const nextConfig\s*=\s*\{)/, "$1\n  output: 'export',");
          if(!s.includes("assetPrefix:")) s=s.replace(/(const nextConfig\s*=\s*\{)/, "$1\n  assetPrefix: './',");
          if(!s.includes("assetPrefix: './'")) throw new Error('Could not configure relative Next asset prefix');
          if(!s.includes("output: 'export'")) throw new Error('Could not configure Next static export');
          fs.writeFileSync(configPath,s);
          JS
          echo '=== VERIFY NO GENERATOR ROUTE ==='
          if grep -Eq 'Grids|Mode.GRIDS|Mutable Instruments' src/pages/index.tsx; then exit 1; fi
          echo '=== BUILD STATIC RENDERER ==='
          npm run build:renderer
          test -f out/index.html
          echo '=== ELECTRON ENTRY AND STATIC FILE ==='
          node -e "const p=require('./package.json');if(p.build.productName!=='Stolperbeats MIDI Converter')process.exit(1)"
          test -f electron/main.js
          echo 'Converter-only UI and static export verified'
          echo '=== INSPECT STATIC HTML ASSET PATHS ==='
          node - <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('out/index.html','utf8');
          const matches=[...html.matchAll(/(?:src|href)="([^"]+)"/g)].map(m=>m[1]);
          const assets=matches.filter(s=>s.includes('_next/'));
          console.log('Next assets:',assets.slice(0,12));
          if(!assets.length) throw new Error('No bundled Next assets in HTML');
          if(assets.some(s=>s.startsWith('/'))) throw new Error('Absolute Next asset URLs will fail with Electron file loading');
          for(const url of assets){
            const file=url.replace(/^\.\//,'').split(/[?#]/)[0];
            if(!fs.existsSync('out/'+file)) throw new Error('Missing asset: '+file);
          }
          console.log('Static asset paths resolve relative to packaged HTML');
          JS
          echo '=== MIDI UPLOADER UI SOURCE FOR END-TO-END AUTOMATION ==='
          find src/components/MidiUploader -type f -maxdepth 3 -print
          sed -n '1,260p' src/components/MidiUploader/index.tsx
          echo '=== ELECTRON MAIN PROCESS ==='
          sed -n '1,160p' electron/main.js
          echo '=== MIDI FIXTURE TO STOLPERBEATS BANK FORMAT ==='
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/__tests__/midi-file-reader.test.ts')
          s=p.read_text()
          old='./src/__tests__/test.mid'
          if s.count(old)!=1: raise SystemExit('Fixture reference changed unexpectedly')
          s=s.replace(old,'./src/core/__tests__/test.mid')
          s=s.replace('.catch(console.error)', '.catch((error) => { console.error(error); process.exitCode = 1; })')
          p.write_text(s)
          PY
          npx --yes --package tsx tsx src/core/__tests__/midi-file-reader.test.ts > /tmp/stopler-midi-bank.txt
          test -s /tmp/stopler-midi-bank.txt
          grep -q 'KICK > PTN0:' /tmp/stopler-midi-bank.txt
          grep -q 'SNARE > PTN0:' /tmp/stopler-midi-bank.txt
          grep -q 'HIHAT1 > PTN0:' /tmp/stopler-midi-bank.txt
          echo 'Fixture converted to bank text with KICK, SNARE and HIHAT1'
          echo '=== PACKAGE ARM64 APPLICATION DIRECTORY (NO DMG OR ZIP) ==='
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dir --arm64 --publish never
          APP=$(find dist -maxdepth 3 -type d -name '*.app' -print -quit)
          test -n "$APP"
          test -f "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Contents/Info.plist"
          file "$APP/Contents/MacOS/"*
          echo '=== CHECK CODE SIGNING STATUS ==='
          codesign -dv --verbose=2 "$APP" 2>&1 || true
          echo 'Local-only ARM64 package created for inspection; not published'

          echo '=== VERIFY PACKAGED ELECTRON AND RENDERER CONTENT ==='
          test -f "$APP/Contents/Resources/app.asar"
          npx --yes @electron/asar list "$APP/Contents/Resources/app.asar" > /tmp/stopler-asar-list.txt
          grep -q '/electron/main.js' /tmp/stopler-asar-list.txt
          grep -q '/out/index.html' /tmp/stopler-asar-list.txt
          echo 'Packaged app contains Electron entry and exported renderer'
          echo '=== LAUNCH ISOLATED APP FOR 15 SECONDS ==='
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -print -quit)
          test -n "$BIN"
          mkdir -p /tmp/stopler-test-home
          HOME=/tmp/stopler-test-home "$BIN" --no-sandbox --remote-debugging-port=9222 > /tmp/stopler-runtime.log 2>&1 &
          PID=$!
          sleep 8
          echo '=== CHROMIUM UI END-TO-END TEST VIA ELECTRON DEBUGGING PORT ==='
          node - <<'JS'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          console.log('Electron dependency:',p.devDependencies?.electron||p.dependencies?.electron);
          JS
          cat > /tmp/stopler-e2e.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright-core');
          const fs=require('fs');
          const assert=require('assert');
          (async()=>{
            const browser=await chromium.connectOverCDP('http://127.0.0.1:9222',{timeout:20000});
            const context=browser.contexts()[0];
            const page=context.pages().find(p=>p.url().startsWith('file:'))||context.pages()[0];
            await page.waitForLoadState('domcontentloaded');
            console.log('UI URL:',page.url());
            console.log('UI title:',await page.title());
            assert((await page.locator('input[type=file]').count())>0,'No MIDI upload inputs');
            const fixture=process.cwd()+'/src/core/__tests__/test.mid';
            await page.locator('input[type=file]').first().setInputFiles(fixture);
            await page.getByRole('button',{name:'Generate',exact:true}).click();
            await page.locator('textarea').waitFor({timeout:20000});
            const text=await page.locator('textarea').inputValue();
            for(const part of ['KICK > PTN0:','SNARE > PTN0:','HIHAT1 > PTN0:']){
              assert(text.includes(part),'Missing track '+part);
            }
            console.log('GUI generated bank:',text.slice(0,220));
            const downloaded=page.waitForEvent('download',{timeout:15000});
            await page.getByRole('button',{name:'Save',exact:true}).click();
            const d=await downloaded;
            assert.equal(d.suggestedFilename(),'PatternBank000.txt');
            const dest='/tmp/stopler-gui-export.txt';
            await d.saveAs(dest);
            const saved=fs.readFileSync(dest,'utf8');
            assert.equal(saved,text,'Saved bank differs from generated bank');
            console.log('END-TO-END PASS: MIDI selected in GUI, generated bank verified, and PatternBank000.txt downloaded');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.58.2
          node -e "require('playwright-core');console.log('Playwright driver ready')"
          echo '=== CAPTURE MACOS DESKTOP FOR VISUAL REVIEW ==='
          mkdir -p ../visual-review
          screencapture -x ../visual-review/stopler-desktop.png || echo 'Desktop capture unavailable on this runner'
          sleep 7
          if kill -0 "$PID" 2>/dev/null; then
            echo 'Electron process stayed alive for 15 seconds'
            kill "$PID" || true
            wait "$PID" || true
          else
            wait "$PID" || CODE=$?
            echo "Electron exited early with code ${CODE:-0}"
            cat /tmp/stopler-runtime.log
            exit 1
          fi
          echo '=== ELECTRON RUNTIME LOG ==='
          tail -60 /tmp/stopler-runtime.log || true
          if grep -Ei 'ERR_FILE_NOT_FOUND|ERR_MODULE_NOT_FOUND|Cannot find module|uncaught exception|Failed to load' /tmp/stopler-runtime.log; then
            echo 'Runtime log contains a loading error'
            exit 1
          fi
          echo 'Isolated Electron process smoke test passed (not a visual UI test)'

      - name: Remove generated files before export
        run: |
          rm -rf source/node_modules source/.next source/audit-production.json
          test -f source/package-lock.json
          test -f source/package.json

      - name: Upload screenshot for manual interface review (no application binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stopler-visual-review
          path: visual-review/stopler-desktop.png
          if-no-files-found: warn
          retention-days: 7
