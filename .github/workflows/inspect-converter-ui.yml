name: Inspect converter interface
on:
  push:
    paths:
      - '.github/workflows/inspect-converter-ui.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Review UI component references
        run: |
          unzip -q stolperbeats-pattern-creator-github-ready.zip -d source
          sed -n '1,180p' source/src/pages/index.tsx
          sed -n '1,180p' source/electron/main.js
