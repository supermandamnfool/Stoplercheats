name: Test major dependency upgrades
on:
  push:
    paths:
      - '.github/workflows/test-major-upgrades.yml'
  workflow_dispatch:
jobs:
  upgrade-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract application source
        run: unzip -q stolperbeats-pattern-creator-github-ready.zip -d source
      - name: Try updated framework and Electron toolchain in isolation
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          for(const [name,version] of Object.entries({'next':'^15.5.12','electron':'^41.7.1','electron-builder':'^26.18.0'})){
            if(p.dependencies?.[name]) p.dependencies[name]=version;
            else if(p.devDependencies?.[name]) p.devDependencies[name]=version;
            else throw new Error('Missing dependency: '+name);
          }
          fs.writeFileSync('package.json',JSON.stringify(p,null,2));
          console.log('Testing versions:',Object.fromEntries(['next','electron','electron-builder'].map(n=>[n,p.dependencies?.[n]||p.devDependencies?.[n]])));
          JS
          npm install --ignore-scripts --no-audit --no-fund
          echo '=== REMAINING PRODUCTION AUDIT ==='
          npm audit --omit=dev --audit-level=low || true
          echo '=== FRAMEWORK BUILD TEST ==='
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/MidiUploader/index.tsx')
          s = p.read_text()
          duplicate = 'const [densitySweepEnabled, setDensitySweepEnabled] = useState(false);'
          if s.count(duplicate) != 2:
              raise SystemExit(f'Expected exactly 2 density declarations, found {s.count(duplicate)}')
          s = s.replace(duplicate, '', 1)
          p.write_text(s)
          PY
          npm run build
