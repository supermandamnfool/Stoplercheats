name: Build personal Mac app
on:
  push:
    branches: [release/converter-source-review, feature/stopler-sequencer-v1]
    paths: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build and verify standalone Apple Silicon app
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
          swift scripts/generate-stoplercheats-icon.swift
          mkdir -p /tmp/stoplercheats.iconset
          for sz in 16 32 128 256 512; do sips -z "$sz" "$sz" electron/icon.png --out "/tmp/stoplercheats.iconset/icon_${sz}x${sz}.png" >/dev/null; done
          for sz in 16 32 128 256 512; do doubled=$((sz * 2)); sips -z "$doubled" "$doubled" electron/icon.png --out "/tmp/stoplercheats.iconset/icon_${sz}x${sz}@2x.png" >/dev/null; done
          iconutil -c icns /tmp/stoplercheats.iconset -o electron/icon.icns
          npm run build:renderer
          npx electron-builder --mac dir --arm64 --publish never
          APP='dist/mac-arm64/Stoplercheats.app'
          bash scripts/verify-mac-package.sh "$APP"
          test -x "$APP/Contents/MacOS/Stoplercheats"
          ditto -c -k --keepParent "$APP" Stoplercheats-Personal-Mac-App.zip
          unzip -t Stoplercheats-Personal-Mac-App.zip | tail -1
      - name: Upload personal app archive
        uses: actions/upload-artifact@v4
        with:
          name: Stoplercheats-Personal-Mac-App
          path: Stoplercheats-Personal-Mac-App.zip
          retention-days: 30
